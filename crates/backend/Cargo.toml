[[bin]]
name = "app"
path = "Source/main.rs"

[build-dependencies]
tauri-build = { version = "1.4.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.4.0", features = ["api-all"] }

[features]
custom-protocol = [ "tauri/custom-protocol" ]

[package]
authors = ["you"]
default-run = "app"
description = "A Tauri App"
edition = "2021"
license-file = "LICENSE"
name = "app"
repository = ""
rust-version = "1.60"
version = "0.1.0"
