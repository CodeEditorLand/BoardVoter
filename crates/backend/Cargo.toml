[[bin]]
name = "board-voter"
path = "Source/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2.5", features = ["api-all"] }

[features]
custom-protocol = [ "tauri/custom-protocol" ]

[package]
authors = ["you"]
default-run = "board-voter"
description = "A Tauri App"
edition = "2024"
license-file = "LICENSE"
name = "board-voter"
repository = ""
rust-version = "1.85.0"
version = "0.1.0"
